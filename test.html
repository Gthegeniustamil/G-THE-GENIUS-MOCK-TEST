<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>G THE GENIUS | Daily Mock Test</title>

<link rel="stylesheet" href="style.css">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#081b33;
color:#fff;
}

.header{
background:#00152d;
padding:15px;
display:flex;
justify-content:space-between;
align-items:center;
position:sticky;
top:0;
}

.logo{
font-size:20px;
font-weight:bold;
color:#FFD700;
}

.timer{
background:#d32f2f;
padding:8px 15px;
border-radius:8px;
font-weight:bold;
}

.container{
max-width:700px;
margin:auto;
padding:15px;
}

.card{
background:#fff;
color:#000;
padding:20px;
border-radius:15px;
margin-top:20px;
}

.qno{
font-weight:bold;
margin-bottom:15px;
}

.question{
font-size:20px;
margin-bottom:20px;
}

.option{
border:1px solid #ddd;
padding:15px;
border-radius:10px;
margin-top:10px;
cursor:pointer;
}

.option:hover{
background:#e8f1ff;
}

.navigation{
display:flex;
justify-content:space-between;
margin-top:20px;
}

.navigation button{
padding:12px 20px;
border:none;
border-radius:8px;
font-size:16px;
}

.prev{
background:#777;
color:#fff;
}

.next{
background:#1565c0;
color:#fff;
}

.palette{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:10px;
margin-top:20px;
}

.palette button{
padding:12px;
background:#003366;
color:#fff;
border:none;
border-radius:8px;
}

.submit{
margin-top:20px;
width:100%;
padding:15px;
font-size:18px;
background:#2e7d32;
color:#fff;
border:none;
border-radius:10px;
}
</style>

</head>

<body>

<div class="header">
<div class="logo">🛡️ G THE GENIUS</div>
<div class="timer" id="timer">10:00</div>
</div>

<div class="container">

<div class="card">

<div class="qno">
Question <span id="qno">1</span> / 10
</div>

<div class="question" id="question">
Loading Question...
</div>

<div class="option" id="op1">Option A</div>
<div class="option" id="op2">Option B</div>
<div class="option" id="op3">Option C</div>
<div class="option" id="op4">Option D</div>

<div class="navigation">

<button class="prev">⬅ Previous</button>

<button class="next">Next ➡</button>

</div>

<div class="palette">

<button>1</button>
<button>2</button>
<button>3</button>
<button>4</button>
<button>5</button>

<button>6</button>
<button>7</button>
<button>8</button>
<button>9</button>
<button>10</button>

</div>

<button class="submit">
Submit Test
</button>

</div>

</div>

<script src="test.js"></script>

</body>
</html>
