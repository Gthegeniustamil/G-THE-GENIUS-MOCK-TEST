<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Mock Test | G THE GENIUS</title>

<link rel="stylesheet" href="style.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#081b33;
color:#fff;
}

header{
background:#00142b;
padding:15px;
display:flex;
justify-content:space-between;
align-items:center;
box-shadow:0 2px 10px rgba(0,0,0,.3);
}

header h2{
color:#FFD700;
font-size:20px;
}

#timer{
background:red;
padding:8px 15px;
border-radius:8px;
font-weight:bold;
}

.container{
padding:15px;
max-width:900px;
margin:auto;
}

.question-box{
background:#fff;
color:#000;
padding:20px;
border-radius:12px;
margin-top:20px;
}

.question-number{
font-size:18px;
font-weight:bold;
margin-bottom:15px;
}

.question{
font-size:20px;
margin-bottom:20px;
}

.option{
background:#f5f5f5;
padding:15px;
margin-bottom:10px;
border-radius:8px;
cursor:pointer;
transition:.3s;
}

.option:hover{
background:#d8e8ff;
}

.palette{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:10px;
margin-top:25px;
}

.palette button{
padding:12px;
border:none;
border-radius:8px;
background:#003366;
color:#fff;
font-weight:bold;
cursor:pointer;
}

.navigation{
display:flex;
justify-content:space-between;
margin-top:25px;
}

.navigation button{
padding:12px 25px;
border:none;
border-radius:8px;
font-size:16px;
cursor:pointer;
}

.prev{
background:#888;
color:#fff;
}

.next{
background:#0066cc;
color:#fff;
}

.submit{
width:100%;
margin-top:20px;
padding:15px;
background:#28a745;
color:#fff;
border:none;
border-radius:10px;
font-size:18px;
cursor:pointer;
}

</style>

</head>

<body>

<header>

<h2>🛡️ G THE GENIUS</h2>

<div id="timer">
10:00
</div>

</header>

<div class="container">

<div class="question-box">

<div class="question-number">
Question 1 / 10
</div>

<div class="question">
Question Loading...
</div>

<div class="option">A</div>

<div class="option">B</div>

<div class="option">C</div>

<div class="option">D</div>

</div>

<div class="palette">

<button>1</button>
<button>2</button>
<button>3</button>
<button>4</button>
<button>5</button>

<button>6</button>
<button>7</button>
<button>8</button>
<button>9</button>
<button>10</button>

</div>

<div class="navigation">

<button class="prev">Previous</button>

<button class="next">Next</button>

</div>

<button class="submit">
Submit Test
</button>

</div>

</body>
</html>
