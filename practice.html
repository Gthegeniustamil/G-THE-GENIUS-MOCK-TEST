<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>G THE GENIUS - Practice Test</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: 'Poppins', Arial, sans-serif;
            color: white;
            background:
                radial-gradient(
                    circle at top,
                    #172d63 0%,
                    transparent 38%
                ),
                linear-gradient(
                    180deg,
                    #081229,
                    #102452
                );
        }

        .practice-container {
            width: 100%;
            max-width: 850px;
            margin: auto;
            padding: 15px;
            padding-bottom: 40px;
        }

        /* HEADER */

        .practice-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 10px 0 18px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand img {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 50%;
            background: white;
            padding: 3px;
            border: 2px solid #FFD700;
        }

        .brand h1 {
            color: #FFD700;
            font-size: 18px;
            font-weight: 800;
        }

        .brand p {
            color: #aeb8d5;
            font-size: 9px;
        }

        .back-btn {
            border: 1px solid rgba(255,255,255,.18);
            background: rgba(255,255,255,.07);
            color: white;
            padding: 8px 13px;
            border-radius: 25px;
            cursor: pointer;
            font-family: inherit;
            font-size: 11px;
        }

        /* SELECTION */

        .selection-card {
            background: rgba(255,255,255,.07);
            border: 1px solid rgba(255,255,255,.14);
            border-radius: 25px;
            padding: 22px;
            box-shadow: 0 15px 40px rgba(0,0,0,.3);
            backdrop-filter: blur(15px);
            margin-bottom: 20px;
        }

        .selection-card h2 {
            color: #FFD700;
            font-size: 20px;
            margin-bottom: 5px;
        }

        .selection-card > p {
            color: #aeb8d5;
            font-size: 11px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            color: #d8def0;
            font-size: 11px;
            font-weight: 600;
            margin-bottom: 7px;
        }

        select,
        input {
            width: 100%;
            padding: 13px 14px;
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,.15);
            background: rgba(255,255,255,.07);
            color: white;
            outline: none;
            font-family: inherit;
            font-size: 12px;
        }

        select:focus,
        input:focus {
            border-color: #FFD700;
            box-shadow: 0 0 0 3px rgba(255,215,0,.08);
        }

        select option {
            background: #101d3d;
            color: white;
        }

        .start-btn {
            width: 100%;
            border: none;
            border-radius: 30px;
            padding: 14px;
            background: linear-gradient(
                135deg,
                #FFD700,
                #FFE98A
            );
            color: #081229;
            font-family: inherit;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            margin-top: 5px;
        }

        .start-btn:active {
            transform: scale(.98);
        }

        /* TEST AREA */

        #testArea {
            display: none;
        }

        .test-top {
            position: sticky;
            top: 0;
            z-index: 20;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 18px;
            background: rgba(8,18,41,.92);
            border: 1px solid rgba(255,255,255,.13);
            backdrop-filter: blur(15px);
        }

        .progress-text {
            color: #cfd6ee;
            font-size: 11px;
        }

        .progress-text strong {
            color: #FFD700;
        }

        .timer {
            color: #FFD700;
            font-size: 14px;
            font-weight: 800;
            padding: 7px 12px;
            border-radius: 20px;
            background: rgba(255,215,0,.08);
            border: 1px solid rgba(255,215,0,.2);
        }

        .timer.warning {
            color: #ff5252;
            border-color: rgba(255,82,82,.4);
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255,255,255,.08);
            border-radius: 20px;
            overflow: hidden;
            margin-bottom: 15px;
        }

        #progressFill {
            width: 0%;
            height: 100%;
            background: linear-gradient(
                90deg,
                #FFD700,
                #FFE98A
            );
            transition: width .3s;
        }

        /* QUESTION */

        .question-card {
            background: rgba(255,255,255,.07);
            border: 1px solid rgba(255,255,255,.14);
            border-radius: 25px;
            padding: 22px;
            box-shadow: 0 15px 40px rgba(0,0,0,.3);
        }

        .question-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .question-number {
            color: #FFD700;
            font-size: 12px;
            font-weight: 800;
        }

        .topic-badge {
            color: #aeb8d5;
            font-size: 9px;
            padding: 5px 9px;
            border-radius: 20px;
            background: rgba(255,255,255,.06);
        }

        .question-text {
            font-size: 16px;
            line-height: 1.7;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            width: 100%;
            padding: 13px;
            border-radius: 15px;
            border: 1px solid rgba(255,255,255,.12);
            background: rgba(255,255,255,.045);
            color: #dce2f4;
            cursor: pointer;
            text-align: left;
            font-family: inherit;
            font-size: 12px;
            line-height: 1.5;
            transition: .2s;
        }

        .option:hover {
            border-color: rgba(255,215,0,.4);
            background: rgba(255,215,0,.06);
        }

        .option.selected {
            border-color: #FFD700;
            background: rgba(255,215,0,.12);
            color: white;
        }

        .option-letter {
            width: 25px;
            height: 25px;
            min-width: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: rgba(255,255,255,.08);
            color: #FFD700;
            font-size: 10px;
            font-weight: 800;
        }

        .option.selected .option-letter {
            background: #FFD700;
            color: #081229;
        }

        /* NAVIGATION */

        .navigation {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .nav-btn {
            flex: 1;
            padding: 13px;
            border-radius: 25px;
            border: 1px solid rgba(255,255,255,.15);
            background: rgba(255,255,255,.06);
            color: white;
            font-family: inherit;
            font-weight: 700;
            font-size: 11px;
            cursor: pointer;
        }

        .nav-btn:hover {
            border-color: #FFD700;
        }

        .submit-btn {
            flex: 1;
            padding: 13px;
            border-radius: 25px;
            border: none;
            background: linear-gradient(
                135deg,
                #FFD700,
                #FFE98A
            );
            color: #081229;
            font-family: inherit;
            font-weight: 800;
            font-size: 11px;
            cursor: pointer;
        }

        /* QUESTION PALETTE */

        .palette-card {
            margin-top: 15px;
            padding: 17px;
            border-radius: 20px;
            background: rgba(255,255,255,.055);
            border: 1px solid rgba(255,255,255,.12);
        }

        .palette-title {
            color: #FFD700;
            font-size: 11px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .palette {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
        }

        .palette button {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,.15);
            background: rgba(255,255,255,.06);
            color: white;
            font-family: inherit;
            font-size: 10px;
            cursor: pointer;
        }

        .palette button.current {
            border-color: #FFD700;
            color: #FFD700;
        }

        .palette button.answered {
            background: rgba(0,230,118,.18);
            border-color: rgba(0,230,118,.5);
            color: #00e676;
        }

        /* LOADING */

        .loading {
            text-align: center;
            padding: 50px 20px;
            color: #9ca8c8;
            font-size: 12px;
        }

        .spinner {
            width: 38px;
            height: 38px;
            margin: 0 auto 12px;
            border: 4px solid rgba(255,255,255,.12);
            border-top-color: #FFD700;
            border-radius: 50%;
            animation: spin .8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .message {
            text-align: center;
            color: #FFD700;
            font-size: 11px;
            margin-top: 10px;
            min-height: 18px;
        }

        /* MOBILE */

        @media(max-width:600px) {

            .practice-container {
                padding: 10px;
            }

            .practice-header {
                padding-top: 5px;
            }

            .brand img {
                width: 44px;
                height: 44px;
            }

            .brand h1 {
                font-size: 15px;
            }

            .brand p {
                font-size: 8px;
            }

            .selection-card,
            .question-card {
                padding: 17px;
                border-radius: 21px;
            }

            .question-text {
                font-size: 14px;
            }

            .option {
                padding: 11px;
                font-size: 11px;
            }

            .test-top {
                padding: 9px;
            }

        }

    </style>
</head>

<body>

<div class="practice-container">

    <!-- HEADER -->

    <header class="practice-header">

        <div class="brand">

            <img
                src="assets/file_00000000711871f8a9ea3ee0524225cb.png"
                alt="G The Genius"
            >

            <div>
                <h1>G THE GENIUS</h1>
                <p>TNUSRB • PRACTICE TEST</p>
            </div>

        </div>

        <button
            class="back-btn"
            id="backBtn"
        >
            ← Back
        </button>

    </header>


    <!-- =========================
         SELECTION AREA
    ========================== -->

    <section
        class="selection-card"
        id="selectionArea"
    >

        <h2>📚 Practice Test</h2>

        <p>
            Subject மற்றும் Topic தேர்வு செய்து
            Practice Test தொடங்குங்கள்.
        </p>


        <div class="form-group">

            <label for="subjectSelect">
                📘 Subject
            </label>

            <select id="subjectSelect">

                <option value="">
                    Select Subject
                </option>

                <option value="GK">
                    General Knowledge
                </option>

                <option value="History">
                    History
                </option>

                <option value="Science">
                    Science
                </option>

                <option value="Geography">
                    Geography
                </option>

                <option value="Current Affairs">
                    Current Affairs
                </option>

                <option value="Tamil">
                    Tamil
                </option>

            </select>

        </div>


        <div class="form-group">

            <label for="topicSelect">
                📖 Topic
            </label>

            <select id="topicSelect">

                <option value="">
                    Select Topic
                </option>

                <option value="All">
                    All Topics
                </option>

            </select>

        </div>


        <div class="form-group">

            <label for="questionCount">
                🔢 Number of Questions
            </label>

            <select id="questionCount">

                <option value="10">
                    10 Questions
                </option>

                <option value="20">
                    20 Questions
                </option>

                <option value="25">
                    25 Questions
                </option>

                <option value="50">
                    50 Questions
                </option>

            </select>

        </div>


        <button
            class="start-btn"
            id="startPracticeBtn"
        >
            🚀 Start Practice Test
        </button>


        <div
            class="message"
            id="selectionMessage"
        ></div>

    </section>


    <!-- =========================
         TEST AREA
    ========================== -->

    <section id="testArea">

        <div class="test-top">

            <div class="progress-text">

                Question

                <strong id="currentQuestionNumber">
                    1
                </strong>

                /

                <strong id="totalQuestionNumber">
                    10
                </strong>

            </div>


            <div
                class="timer"
                id="timer"
            >
                ⏰ 15:00
            </div>

        </div>


        <div class="progress-bar">

            <div
                id="progressFill"
            ></div>

        </div>


        <!-- QUESTION -->

        <div class="question-card">

            <div class="question-meta">

                <div
                    class="question-number"
                    id="questionNumber"
                >
                    Question 1
                </div>

                <div
                    class="topic-badge"
                    id="questionTopic"
                >
                    Topic
                </div>

            </div>


            <div
                class="question-text"
                id="questionText"
            >
                Loading question...
            </div>


            <div
                class="options"
                id="optionsContainer"
            ></div>

        </div>


        <!-- NAVIGATION -->

        <div class="navigation">

            <button
                class="nav-btn"
                id="previousBtn"
            >
                ← Previous
            </button>

            <button
                class="nav-btn"
                id="nextBtn"
            >
                Next →
            </button>

            <button
                class="submit-btn"
                id="submitBtn"
            >
                Submit ✓
            </button>

        </div>


        <!-- QUESTION PALETTE -->

        <div class="palette-card">

            <div class="palette-title">
                📋 Question Palette
            </div>

            <div
                class="palette"
                id="questionPalette"
            ></div>

        </div>

    </section>


    <!-- LOADING -->

    <div
        class="loading"
        id="loadingBox"
        style="display:none;"
    >

        <div class="spinner"></div>

        Loading Questions...

    </div>

</div>


<!-- =========================
     JAVASCRIPT
========================== -->

<script type="module" src="practice.js"></script>

</body>
</html>
