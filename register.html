<!DOCTYPE html>

<head>

<meta name="viewport"
content="width=device-width, initial-scale=1.0">



<title>
Register | G THE GENIUS
</title>




<meta name="theme-color"
content="#081229">

content="Create your G THE GENIUS Mock Test Portal account">





<!-- Logo -->

<link rel="icon"
href="assets/file_00000000711871f8a9ea3ee0524225cb.png">





<!-- Main CSS -->

<link rel="stylesheet"
href="style.css">



<style>


.register-page{

    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    padding:20px;

}



.register-card{

    width:100%;

    max-width:420px;

    background:rgba(255,255,255,0.08);

    border:1px solid rgba(255,255,255,0.15);

    border-radius:25px;

    padding:30px 20px;

    backdrop-filter:blur(15px);

    box-shadow:0 8px 25px rgba(0,0,0,0.35);

}



.register-logo{

    width:90px;

    height:90px;

    border-radius:50%;

    object-fit:cover;

    display:block;

    margin:auto;

    border:3px solid #f5c542;

}



.register-card h1{

    text-align:center;

    margin-top:15px;

    color:#f5c542;

    font-size:25px;

}



.register-card p{

    text-align:center;

    color:#d8def0;

    font-size:13px;

    margin-bottom:25px;

}




.input-box{

    margin-bottom:15px;

}



.input-box label{

    display:block;

    color:white;

    font-size:13px;

    margin-bottom:6px;

}



.input-box input,
.input-box select{


    width:100%;

    padding:13px;

    border-radius:15px;

    border:1px solid rgba(255,255,255,0.2);

    background:rgba(255,255,255,0.1);

    color:white;

    outline:none;


}


.input-box select option{

    color:black;

}





/* REGISTER BUTTON */


.register-btn{


    width:100%;

    padding:14px;


    border:none;

    border-radius:30px;


    background:#f5c542;


    color:#081229;


    font-size:16px;


    font-weight:700;


    cursor:pointer;


    margin-top:10px;


    transition:0.3s;


}



.register-btn:hover{


    transform:translateY(-2px);


}







/* MESSAGE BOX */


#registerMessage{


    text-align:center;


    margin-top:15px;


    font-size:13px;


    color:#ffd86b;


}





/* LOGIN LINK */


.login-link{


    text-align:center;


    margin-top:20px;


    color:#d8def0;


    font-size:14px;


}



.login-link a{


    color:#f5c542;


    text-decoration:none;


    font-weight:600;


}



</style>


</head>






<body>



<div class="register-page">



<div class="register-card">





<!-- LOGO -->


<img src="assets/file_00000000711871f8a9ea3ee0524225cb.png"

alt="G THE GENIUS Logo"

class="register-logo">

Select District

<option>Madurai</option>
<option>Mayiladuthurai</option>
<option>Nagapattinam</option>
<option>Namakkal</option>
<option>Nilgiris</option>
<option>Perambalur</option>
<option>Pudukkottai</option>
<option>Ramanathapuram</option>
<option>Ranipet</option>
<option>Salem</option>
<option>Sivaganga</option>
<option>Tenkasi</option>

<option>Tiruchirappalli</option>
<option>Tirunelveli</option>

<option>Tiruppur</option>
<option>Tiruvallur</option>
<option>Tiruvannamalai</option>
<option>Tiruvarur</option>
<option>Vellore</option>
<option>Viluppuram</option>
<option>Virudhunagar</option>

</select>





<div class="input-box">


<label>

Email Address

</label>



<input type="email"

id="email"

placeholder="Enter email"

required>



</div>





<div class="input-box">


<label>

Password

</label>


<input type="password"

id="password"

placeholder="Create password"

required>



</div>  

  



<div class="input-box">


<label>

Confirm Password

</label>


<input type="password"

id="confirmPassword"

placeholder="Confirm password"

required>


</div>







<button type="submit"

class="register-btn">


Create Account


</button>







<p id="registerMessage"></p>






</form>








<div class="login-link">


Already have an account?


<a href="login.html">

Login

</a>



</div>







</div>


</div>
