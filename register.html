<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>

Register | G THE GENIUS

</title>

<meta name="theme-color"
content="#081229">

<link rel="icon"
href="assets/file_00000000711871f8a9ea3ee0524225cb.png">

<link rel="stylesheet" href="css/style.css">
  
<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
rel="stylesheet">

</head>

<body>

<div class="login-container">

<div class="login-card">

<img

src="assets/file_00000000711871f8a9ea3ee0524225cb.png"

class="logo"

alt="Logo">

<h1>

Create Account

</h1>

<p>

Join G THE GENIUS

Government Exam Portal

</p>

<form id="registerForm">

<div class="input-group">

<label>

Full Name

</label>

<input

type="text"

id="name"

placeholder="Enter Full Name"

required>

</div>

<div class="input-group">

<label>

District

</label>

<select id="district" required>

<option value="">Select District</option>

<option>Ariyalur</option>
<option>Chengalpattu</option>
<option>Chennai</option>
<option>Coimbatore</option>
<option>Cuddalore</option>
<option>Dharmapuri</option>
<option>Dindigul</option>
<option>Erode</option>
<option>Kallakurichi</option>
<option>Kanchipuram</option>
<option>Kanniyakumari</option>
<option>Karur</option>
<option>Krishnagiri</option>
<option>Madurai</option>
<option>Mayiladuthurai</option>
<option>Nagapattinam</option>
<option>Namakkal</option>
<option>Nilgiris</option>
<option>Perambalur</option>
<option>Pudukkottai</option>
<option>Ramanathapuram</option>
<option>Ranipet</option>
<option>Salem</option>
<option>Sivagangai</option>
<option>Tenkasi</option>
<option>Thanjavur</option>
<option>Theni</option>
<option>Thoothukudi</option>
<option>Tiruchirappalli</option>
<option>Tirunelveli</option>
<option>Tirupattur</option>
<option>Tiruppur</option>
<option>Tiruvallur</option>
<option>Tiruvannamalai</option>
<option>Tiruvarur</option>
<option>Vellore</option>
<option>Viluppuram</option>
<option>Virudhunagar</option>

</select>

</div>

<div class="input-group">

<label>

Email

</label>

<input

type="email"

id="email"

placeholder="Enter Email"

required>

</div>

<div class="input-group">

<label>

Password

</label>

<input

type="password"

id="password"

placeholder="Minimum 6 Characters"

required>

</div>

  <div class="input-group">

<label>

Confirm Password

</label>

<input

type="password"

id="confirmPassword"

placeholder="Confirm Password"

required>

</div>


<div class="show-password">

<input

type="checkbox"

id="showPassword">


<label for="showPassword">

Show Password

</label>

</div>


<div class="terms-box">

<input

type="checkbox"

id="terms"

required>


<label for="terms">

I agree to the

<a href="#">

Terms & Conditions

</a>

and

<a href="#">

Privacy Policy

</a>

</label>

</div>


<button

type="submit"

class="login-btn">

Create Account

</button>


<p id="registerMessage"></p>


</form>


<div class="auth-link">

Already have an account?

<a href="login.html">

Login Here

</a>

</div>


</div>

</div>



<footer>

<p>

© 2026 G THE GENIUS

<br>

All Government Exam Mock Test Portal

</p>

</footer>


<script type="module" src="js/auth.js"></script>


<script>

const password =
document.getElementById("password");

const confirmPassword =
document.getElementById("confirmPassword");

const showPassword =
document.getElementById("showPassword");


showPassword.addEventListener("change",()=>{


if(showPassword.checked)

{

password.type="text";

confirmPassword.type="text";

}

else

{

password.type="password";

confirmPassword.type="password";

}


});


</script>


</body>

</html>
