<!DOCTYPE html>
<html lang="ta">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>G THE GENIUS - Result</title>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {

            min-height: 100vh;

            font-family:
                'Poppins',
                Arial,
                sans-serif;

            color: white;

            background:
                radial-gradient(
                    circle at top,
                    #172d63 0%,
                    transparent 38%
                ),
                linear-gradient(
                    180deg,
                    #081229,
                    #102452
                );

        }

        .result-container {

            width: 100%;
            max-width: 900px;

            margin: auto;

            padding: 15px;

            padding-bottom: 50px;

        }


        /* HEADER */

        .result-header {

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 10px;

            padding: 10px 0 18px;

        }

        .brand {

            display: flex;

            align-items: center;

            gap: 10px;

        }

        .brand img {

            width: 50px;
            height: 50px;

            object-fit: cover;

            border-radius: 50%;

            background: white;

            padding: 3px;

            border: 2px solid #FFD700;

        }

        .brand h1 {

            color: #FFD700;

            font-size: 18px;

            font-weight: 800;

        }

        .brand p {

            color: #aeb8d5;

            font-size: 9px;

        }

        .home-btn {

            padding: 8px 13px;

            border-radius: 25px;

            border: 1px solid
                rgba(255,255,255,.16);

            background:
                rgba(255,255,255,.07);

            color: white;

            font-family: inherit;

            font-size: 11px;

            cursor: pointer;

        }


        /* RESULT HERO */

        .result-hero {

            text-align: center;

            padding: 28px 18px;

            border-radius: 28px;

            background:
                linear-gradient(
                    135deg,
                    rgba(255,215,0,.15),
                    rgba(255,255,255,.06)
                );

            border: 1px solid
                rgba(255,215,0,.25);

            box-shadow:
                0 15px 40px
                rgba(0,0,0,.35);

            margin-bottom: 18px;

        }

        .result-icon {

            font-size: 42px;

            margin-bottom: 8px;

        }

        .result-hero h2 {

            color: #FFD700;

            font-size: 24px;

            margin-bottom: 4px;

        }

        .result-hero p {

            color: #aeb8d5;

            font-size: 11px;

        }


        /* SCORE */

        .score-box {

            margin: 20px auto 0;

            width: 150px;
            height: 150px;

            border-radius: 50%;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            background:
                rgba(255,215,0,.08);

            border: 5px solid #FFD700;

            box-shadow:
                0 0 35px
                rgba(255,215,0,.14);

        }

        .score-box strong {

            color: #FFD700;

            font-size: 38px;

            line-height: 1;

        }

        .score-box span {

            color: #cfd6ee;

            font-size: 10px;

            margin-top: 6px;

        }


        /* SUMMARY */

        .summary-grid {

            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 10px;

            margin-bottom: 25px;

        }

        .summary-card {

            text-align: center;

            padding: 16px 8px;

            border-radius: 18px;

            background:
                rgba(255,255,255,.06);

            border: 1px solid
                rgba(255,255,255,.12);

        }

        .summary-card span {

            display: block;

            color: #aeb8d5;

            font-size: 9px;

            margin-bottom: 5px;

        }

        .summary-card strong {

            font-size: 21px;

        }

        .correct-count {

            color: #00e676;

        }

        .wrong-count {

            color: #ff5252;

        }

        .skipped-count {

            color: #ffb300;

        }

        .total-count {

            color: #FFD700;

        }


        /* REVIEW HEADER */

        .review-header {

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 10px;

            margin-bottom: 14px;

        }

        .review-header h2 {

            color: #FFD700;

            font-size: 19px;

        }

        .review-header p {

            color: #8f9abb;

            font-size: 9px;

        }


        /* FILTER */

        .review-filter {

            display: flex;

            gap: 7px;

            flex-wrap: wrap;

            margin-bottom: 15px;

        }

        .filter-btn {

            padding: 8px 13px;

            border-radius: 20px;

            border: 1px solid
                rgba(255,255,255,.13);

            background:
                rgba(255,255,255,.05);

            color: #cfd6ee;

            font-family: inherit;

            font-size: 10px;

            cursor: pointer;

        }

        .filter-btn.active {

            color: #081229;

            background: #FFD700;

            border-color: #FFD700;

            font-weight: 800;

        }


        /* REVIEW CARD */

        .review-list {

            display: flex;

            flex-direction: column;

            gap: 14px;

        }

        .review-card {

            padding: 18px;

            border-radius: 22px;

            background:
                rgba(255,255,255,.06);

            border: 1px solid
                rgba(255,255,255,.12);

        }

        .review-card.correct {

            border-left: 4px solid
                #00e676;

        }

        .review-card.wrong {

            border-left: 4px solid
                #ff5252;

        }

        .review-card.skipped {

            border-left: 4px solid
                #ffb300;

        }


        .review-top {

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 10px;

            margin-bottom: 10px;

        }

        .review-number {

            color: #FFD700;

            font-size: 11px;

            font-weight: 800;

        }

        .status-badge {

            padding: 5px 9px;

            border-radius: 20px;

            font-size: 9px;

            font-weight: 800;

        }

        .status-correct {

            color: #00e676;

            background:
                rgba(0,230,118,.09);

        }

        .status-wrong {

            color: #ff7777;

            background:
                rgba(255,82,82,.09);

        }

        .status-skipped {

            color: #ffb300;

            background:
                rgba(255,179,0,.09);

        }


        .review-question {

            font-size: 14px;

            line-height: 1.7;

            font-weight: 600;

            margin-bottom: 14px;

        }


        /* OPTIONS */

        .review-options {

            display: flex;

            flex-direction: column;

            gap: 7px;

            margin-bottom: 14px;

        }

        .review-option {

            padding: 9px 11px;

            border-radius: 11px;

            background:
                rgba(255,255,255,.035);

            border: 1px solid
                rgba(255,255,255,.08);

            color: #cfd6ee;

            font-size: 10px;

        }

        .review-option.user-answer {

            border-color:
                rgba(255,82,82,.5);

            background:
                rgba(255,82,82,.08);

            color: #ff9999;

        }

        .review-option.correct-answer {

            border-color:
                rgba(0,230,118,.5);

            background:
                rgba(0,230,118,.08);

            color: #00e676;

        }

        .review-option.user-correct {

            border-color:
                rgba(0,230,118,.6);

            background:
                rgba(0,230,118,.12);

            color: #00e676;

        }


        /* ANSWER BOX */

        .answer-info {

            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 8px;

            margin-bottom: 12px;

        }

        .answer-box {

            padding: 10px;

            border-radius: 12px;

            background:
                rgba(255,255,255,.04);

        }

        .answer-box span {

            display: block;

            color: #8f9abb;

            font-size: 8px;

            margin-bottom: 4px;

        }

        .answer-box strong {

            font-size: 10px;

            line-height: 1.5;

        }

        .your-answer {

            color: #ff9999;

        }

        .correct-answer-text {

            color: #00e676;

        }

        .not-answered {

            color: #ffb300;

        }


        /* EXPLANATION */

        .explanation {

            padding: 12px;

            border-radius: 14px;

            background:
                rgba(255,215,0,.06);

            border: 1px solid
                rgba(255,215,0,.14);

        }

        .explanation-title {

            color: #FFD700;

            font-size: 10px;

            font-weight: 800;

            margin-bottom: 5px;

        }

        .explanation p {

            color: #cfd6ee;

            font-size: 10px;

            line-height: 1.7;

        }


        /* BUTTONS */

        .bottom-actions {

            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 10px;

            margin-top: 25px;

        }

        .action-btn {

            padding: 13px;

            border-radius: 28px;

            font-family: inherit;

            font-size: 11px;

            font-weight: 800;

            cursor: pointer;

        }

        .retry-btn {

            border: none;

            background:
                linear-gradient(
                    135deg,
                    #FFD700,
                    #FFE98A
                );

            color: #081229;

        }

        .dashboard-btn {

            border: 1px solid
                rgba(255,255,255,.15);

            background:
                rgba(255,255,255,.06);

            color: white;

        }


        /* EMPTY */

        .empty-review {

            text-align: center;

            padding: 40px 15px;

            color: #8f9abb;

            font-size: 11px;

            background:
                rgba(255,255,255,.04);

            border-radius: 20px;

        }


        @media(max-width:600px) {

            .result-container {
                padding: 10px;
            }

            .brand img {
                width: 44px;
                height: 44px;
            }

            .brand h1 {
                font-size: 15px;
            }

            .brand p {
                font-size: 8px;
            }

            .summary-grid {
                grid-template-columns:
                    repeat(2, 1fr);
            }

            .score-box {
                width: 130px;
                height: 130px;
            }

            .score-box strong {
                font-size: 32px;
            }

            .review-question {
                font-size: 13px;
            }

            .answer-info {
                grid-template-columns: 1fr;
            }

            .bottom-actions {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>


<div class="result-container">


    <!-- HEADER -->

    <header class="result-header">

        <div class="brand">

            <img
                src="assets/file_00000000711871f8a9ea3ee0524225cb.png"
                alt="G The Genius"
            >

            <div>

                <h1>G THE GENIUS</h1>

                <p>
                    TNUSRB • RESULT
                </p>

            </div>

        </div>


        <button
            class="home-btn"
            id="homeBtn"
        >
            🏠 Dashboard
        </button>

    </header>


    <!-- RESULT HERO -->

    <section class="result-hero">

        <div
            class="result-icon"
            id="resultIcon"
        >
            🏆
        </div>

        <h2 id="resultTitle">
            Practice Test Completed!
        </h2>

        <p id="resultSubtitle">
            உங்கள் Result Review கீழே உள்ளது.
        </p>


        <div class="score-box">

            <strong id="scoreValue">
                0
            </strong>

            <span>
                MARKS
            </span>

        </div>

    </section>


    <!-- SUMMARY -->

    <section class="summary-grid">

        <div class="summary-card">

            <span>
                TOTAL
            </span>

            <strong
                class="total-count"
                id="totalCount"
            >
                0
            </strong>

        </div>


        <div class="summary-card">

            <span>
                CORRECT
            </span>

            <strong
                class="correct-count"
                id="correctCount"
            >
                0
            </strong>

        </div>


        <div class="summary-card">

            <span>
                WRONG
            </span>

            <strong
                class="wrong-count"
                id="wrongCount"
            >
                0
            </strong>

        </div>


        <div class="summary-card">

            <span>
                SKIPPED
            </span>

            <strong
                class="skipped-count"
                id="skippedCount"
            >
                0
            </strong>

        </div>

    </section>


    <!-- REVIEW -->

    <section>

        <div class="review-header">

            <div>

                <h2>
                    📚 Question Review
                </h2>

                <p>
                    ஒவ்வொரு கேள்வியையும் சரிபார்க்கலாம்
                </p>

            </div>

        </div>


        <!-- FILTER -->

        <div class="review-filter">

            <button
                class="filter-btn active"
                data-filter="all"
            >
                All
            </button>

            <button
                class="filter-btn"
                data-filter="correct"
            >
                🟢 Correct
            </button>

            <button
                class="filter-btn"
                data-filter="wrong"
            >
                🔴 Wrong
            </button>

            <button
                class="filter-btn"
                data-filter="skipped"
            >
                🟡 Skipped
            </button>

        </div>


        <div
            class="review-list"
            id="reviewList"
        ></div>

    </section>


    <!-- ACTIONS -->

    <div class="bottom-actions">

        <button
            class="action-btn retry-btn"
            id="retryBtn"
        >
            🔄 Retry Practice
        </button>

        <button
            class="action-btn dashboard-btn"
            id="dashboardBtn"
        >
            🏠 Go to Dashboard
        </button>

    </div>


</div>


<script src="result.js"></script>

</body>

</html>
