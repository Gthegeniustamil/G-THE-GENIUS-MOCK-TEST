<style>


.login-page{

    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    padding:20px;

}





.login-card{


    width:100%;

    max-width:420px;


    background:rgba(255,255,255,0.08);


    border:1px solid rgba(255,255,255,0.15);


    border-radius:25px;


    padding:30px 20px;


    backdrop-filter:blur(15px);


    box-shadow:0 8px 25px rgba(0,0,0,0.35);



}






.login-logo{


    width:90px;


    height:90px;


    border-radius:50%;


    object-fit:cover;


    display:block;


    margin:auto;


    border:3px solid #f5c542;


}






.login-card h1{


    text-align:center;


    color:#f5c542;


    margin-top:15px;


    font-size:26px;


}




.login-card p{


    text-align:center;


    color:#d8def0;


    font-size:13px;


    margin-bottom:25px;


}







.login-input{


    margin-bottom:15px;


}

 
.login-input label{


    display:block;


    color:white;


    font-size:13px;


    margin-bottom:6px;


}





.login-input input{


    width:100%;


    padding:13px;


    border-radius:15px;


    border:1px solid rgba(255,255,255,0.2);


    background:rgba(255,255,255,0.1);


    color:white;


    outline:none;



}






.login-btn{


    width:100%;


    padding:14px;


    border:none;


    border-radius:30px;


    background:#f5c542;


    color:#081229;


    font-size:16px;


    font-weight:700;


    cursor:pointer;


    margin-top:10px;


    transition:0.3s;



}



.login-btn:hover{


    transform:translateY(-2px);


}





#loginMessage{


    text-align:center;


    margin-top:15px;


    color:#ffd86b;


    font-size:13px;


}







.forgot-link{


    text-align:right;


    margin-top:10px;


}



.forgot-link a{


    color:#f5c542;


    font-size:13px;


    text-decoration:none;


}







.register-link{


    text-align:center;


    margin-top:20px;


    color:#d8def0;


    font-size:14px;


}



.register-link a{


    color:#f5c542;


    text-decoration:none;


    font-weight:600;


}



</style>


</head>





<body>



<div class="login-page">



<div class="login-card">






<!-- LOGO -->


<img src="assets/file_00000000711871f8a9ea3ee0524225cb.png"

alt="G THE GENIUS Logo"

class="login-logo">







<h1>

Welcome Back

</h1>



<p>

Login to Continue Your Exam Preparation

</p>








<form id="loginForm">






<div class="login-input">


<label>

Email Address

</label>


<input type="email"

id="email"

placeholder="Enter your email"

required>


</div>







<div class="login-input">


<label>

Password

</label>



<input type="password"

id="password"

placeholder="Enter your password"

required>


</div>

  



<button type="submit"

class="login-btn">


Login


</button>







<p id="loginMessage"></p>






</form>








<div class="forgot-link">


<a href="#"

id="forgotPassword">


Forgot Password?


</a>


</div>









<div class="register-link">


Don't have an account?


<a href="register.html">

Register Now

</a>



</div>







</div>


</div>

<footer class="app-footer">
