<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>G THE GENIUS - Student Login</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="login-box">

<h1>🛡️ G THE GENIUS</h1>
<h3>TNUSRB MOCK TEST</h3>

<input type="text" id="studentName" placeholder="Enter Student Name">

<select id="district">
<option value="">Select District</option>
<option>Ariyalur</option>
<option>Chengalpattu</option>
<option>Chennai</option>
<option>Coimbatore</option>
<option>Cuddalore</option>
<option>Dharmapuri</option>
<option>Dindigul</option>
<option>Erode</option>
<option>Kallakurichi</option>
<option>Kanchipuram</option>
<option>Kanyakumari</option>
<option>Karur</option>
<option>Krishnagiri</option>
<option>Madurai</option>
<option>Mayiladuthurai</option>
<option>Nagapattinam</option>
<option>Namakkal</option>
<option>Nilgiris</option>
<option>Perambalur</option>
<option>Pudukkottai</option>
<option>Ramanathapuram</option>
<option>Ranipet</option>
<option>Salem</option>
<option>Sivagangai</option>
<option>Tenkasi</option>
<option>Thanjavur</option>
<option>Theni</option>
<option>Thoothukudi</option>
<option>Tiruchirappalli</option>
<option>Tirunelveli</option>
<option>Tirupattur</option>
<option>Tiruppur</option>
<option>Tiruvallur</option>
<option>Tiruvannamalai</option>
<option>Tiruvarur</option>
<option>Vellore</option>
<option>Viluppuram</option>
<option>Virudhunagar</option>
</select>
  
<select id="exam">
<option value="">Select Exam</option>
<option value="PC">TNUSRB Police Constable (PC)</option>
<option value="SI">TNUSRB Sub Inspector (SI)</option>
<option value="TNPSC">TNPSC</option>
<option value="GROUP2">TNPSC Group 2</option>
<option value="GROUP4">TNPSC Group 4</option>
<option value="SSC">SSC</option>
<option value="RRB">Railway (RRB)</option>
<option value="BANK">Bank Exams</option>
<option value="TET">TNTET</option>
<option value="ALL">All Government Exams</option>
</select>
  
<button onclick="goDashboard()">
Start Test
</button>

</div>

<script>

function goDashboard(){

let name = document.getElementById("studentName").value;
let district = document.getElementById("district").value;
let exam = document.getElementById("exam").value;

if(name === "" || district === "" || exam === ""){

alert("Please fill all details");

return;

}

localStorage.setItem("studentName", name);
localStorage.setItem("district", district);
localStorage.setItem("exam", exam);

window.location.href = "dashboard.html";

}

</script>

<script type="module" src="script.js"></script>

</body>
</html>
