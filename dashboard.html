<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>G THE GENIUS Dashboard</title>

<link rel="stylesheet" href="dashboard.css">

</head>


<body>


<div class="dashboard-container">



<!-- LOGO -->

<div class="logo-area">

<img src="assets/file_00000000711871f8a9ea3ee0524225cb.png"
class="dashboard-logo">

</div>




<h1>
🛡️ G THE GENIUS
</h1>


<h3>
TNUSRB MOCK TEST PORTAL
</h3>




<div class="student-card">


<h2>
Welcome 👋
<span id="studentName">
Student
</span>
</h2>


<p>
📍 District :
<span id="district">
-
</span>
</p>


</div>





<!-- TEST CARDS -->


<div class="test-card daily">

<h2>
🟢 Daily Mock Test
</h2>

<p>
10 Questions
</p>

<p>
⏰ 5 Minutes
</p>


<button onclick="startTest('daily')">

Start Test

</button>

</div>





<div class="test-card weekly">

<h2>
🟡 Weekly Mock Test
</h2>

<p>
25 Questions
</p>

<p>
⏰ 10 Minutes
</p>


<button onclick="startTest('weekly')">

Start Test

</button>

</div>





<div class="test-card monthly">

<h2>
🔴 Monthly Grand Test
</h2>

<p>
100 Questions
</p>

<p>
⏰ 60 Minutes
</p>


<button onclick="startTest('monthly')">

Start Test

</button>

</div>






<div class="menu-buttons">


<button onclick="location.href='profile.html'">

👤 My Profile

</button>



<button onclick="location.href='leaderboard.html'">

🏆 Leaderboard

</button>



<button onclick="logout()">

🚪 Logout

</button>


</div>


</div>






<script>


document.getElementById("studentName").innerHTML =
localStorage.getItem("studentName") || "Student";


document.getElementById("district").innerHTML =
localStorage.getItem("district") || "-";





function startTest(type){

window.location.href =
"mocktest.html?type="+type;

}





function logout(){

localStorage.clear();

window.location.href="index.html";

}


</script>



</body>

</html>
