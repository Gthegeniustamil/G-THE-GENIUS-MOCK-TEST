<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>G THE GENIUS Dashboard</title>

<link rel="stylesheet" href="dashboard.css">

</head>


<body>


<div class="dashboard">


<div class="top-header">

<img src="assets/logo.png" class="logo">

<div>
<h1>🛡️ G THE GENIUS</h1>
<p>TNUSRB MOCK TEST PORTAL</p>
</div>

<button id="logoutBtn">
🚪 Logout
</button>

</div>



<div class="welcome-card">

<h2>
👋 Welcome <span id="studentName"></span>
</h2>

<p>
Prepare • Practice • Achieve Your Dream
</p>

</div>




<div class="test-grid">


<div class="test-card daily">

<h2>🟢 Daily Mock Test</h2>

<p>
10 Questions
</p>

<p>
⏰ 5 Minutes
</p>

<button onclick="startTest('daily')">
Start Test
</button>

</div>



<div class="test-card weekly">

<h2>🟡 Weekly Mock Test</h2>

<p>
25 Questions
</p>

<p>
⏰ 10 Minutes
</p>

<button onclick="startTest('weekly')">
Start Test
</button>

</div>




<div class="test-card monthly">

<h2>🔴 Monthly Grand Test</h2>

<p>
100 Questions
</p>

<p>
⏰ 60 Minutes
</p>

<button onclick="startTest('monthly')">
Start Test
</button>

</div>


</div>





<div class="menu">


<button onclick="location.href='leaderboard.html'">
🏆 Leaderboard
</button>


<button onclick="location.href='profile.html'">
👤 My Profile
</button>


</div>



</div>



<script type="module" src="dashboard.js"></script>


<script>

function startTest(type){

window.location.href =
"mocktest.html?type="+type;

}

</script>


</body>

</html>
