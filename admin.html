<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>G THE GENIUS Admin Panel</title>

<link rel="stylesheet" href="admin.css">

</head>


<body>


<div class="admin-container">



<!-- HEADER -->

<div class="admin-header">

<h1>
🛡️ G THE GENIUS
</h1>

<p>
Admin Control Panel
</p>

</div>

<button id="logoutBtn">
🚪 Logout
</button>



<!-- MENU -->


<div class="admin-menu">



<div class="admin-card">

<h2>
➕
</h2>

<h3>
Add Question
</h3>

<p>
Create New Mock Test Questions
</p>

</div>





<div class="admin-card">

<h2>
📚
</h2>

<h3>
Manage Questions
</h3>

<p>
Edit / Delete Questions
</p>

</div>





<div class="admin-card">

<h2>
👨‍🎓
</h2>

<h3>
Students Result
</h3>

<p>
View Exam Performance
</p>

</div>





<div class="admin-card">

<h2>
🏆
</h2>

<h3>
Leaderboard
</h3>

<p>
Top Rank Students
</p>

</div>




</div>



<!-- ADD QUESTION FORM -->

<div class="question-form">

<h2>➕ Add New Question</h2>

<input id="question" type="text" placeholder="Enter Question">

<input id="option0" type="text" placeholder="Option A">

<input id="option1" type="text" placeholder="Option B">

<input id="option2" type="text" placeholder="Option C">

<input id="option3" type="text" placeholder="Option D">

<select id="answer">
    <option value="">Correct Answer</option>
    <option value="0">Option A</option>
    <option value="1">Option B</option>
    <option value="2">Option C</option>
    <option value="3">Option D</option>
</select>

<textarea id="explanation" placeholder="Explanation"></textarea>

<button id="saveQuestion">
Save Question
</button>

</div>

<!-- BULK UPLOAD -->

<div class="bulk-upload">

<h2>📤 Bulk Question Upload</h2>

<textarea
id="bulkJson"
rows="15"
placeholder="Paste JSON Questions Here">
</textarea>

<br><br>

<button id="uploadBtn">
Upload Questions
</button>

<p id="uploadStatus"></p>

</div>
