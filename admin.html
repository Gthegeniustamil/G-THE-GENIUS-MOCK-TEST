<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">


<title>
Admin Panel | G THE GENIUS
</title>


<meta name="theme-color"
content="#081229">



<link rel="preconnect"
href="https://fonts.googleapis.com">


<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>


<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
rel="stylesheet">



<link rel="stylesheet"
href="css/admin.css">


</head>



<body>



<div class="admin-container">





<!-- =========================
     Admin Header
========================= -->


<header class="admin-header">


<img src="assets/file_00000000711871f8a9ea3ee0524225cb.png"
class="logo"
alt="G THE GENIUS Logo">





<h1>

⚡ Admin Panel

</h1>




<p>

Manage G THE GENIUS Mock Test System

</p>


</header>







<!-- =========================
     Admin Status
========================= -->


<section class="admin-card">



<h2>

🔐 Admin Dashboard

</h2>



<p id="adminStatus">

Checking Access...

</p>



</section>
<!-- =========================
     Add Question Section
========================= -->


<section class="admin-card question-section">



<h2>

➕ Add New Question

</h2>





<div class="form-group">


<label>

Subject

</label>



<select id="subjectSelect">


<option value="">

Select Subject

</option>


<option value="Tamil">

Tamil

</option>


<option value="General Knowledge">

General Knowledge

</option>


<option value="History">

History

</option>


<option value="Geography">

Geography

</option>


<option value="Polity">

Polity

</option>


<option value="Science">

Science

</option>


</select>


</div>








<div class="form-group">


<label>

Topic

</label>



<select id="topicSelect">


<option value="">

Select Topic

</option>


</select>


</div>







<div class="form-group">


<label>

Question

</label>



<textarea id="questionText"
placeholder="Enter question">

</textarea>


</div>







<div class="form-group">


<label>

Option A

</label>



<input type="text"
id="optionA"
placeholder="Option A">


</div>







<div class="form-group">


<label>

Option B

</label>



<input type="text"
id="optionB"
placeholder="Option B">


</div>







<div class="form-group">


<label>

Option C

</label>



<input type="text"
id="optionC"
placeholder="Option C">


</div>







<div class="form-group">


<label>

Option D

</label>



<input type="text"
id="optionD"
placeholder="Option D">


</div>

 <!-- =========================
     Answer & Save Section
========================= -->


<div class="form-group">


<label>

Correct Answer

</label>



<select id="correctAnswer">


<option value="">

Select Answer

</option>


<option value="A">

A

</option>


<option value="B">

B

</option>


<option value="C">

C

</option>


<option value="D">

D

</option>


</select>


</div>







<div class="form-group">


<label>

Explanation

</label>



<textarea id="explanation"
placeholder="Enter explanation">

</textarea>


</div>







<button id="addQuestionBtn"
class="admin-btn">


➕ Add Question


</button>




</section>








<!-- =========================
     Bulk Upload Section
========================= -->


<section class="admin-card">



<h2>

📤 Smart Bulk Upload

</h2>



<p>

Upload multiple questions easily

</p>




<input type="file"
id="bulkFile"
accept=".json,.csv">





<button id="uploadBtn"
class="admin-btn">


⬆️ Upload Questions


</button>



<div id="uploadStatus">

</div>



</section>








<!-- =========================
     Manage Section
========================= -->


<section class="admin-card">



<h2>

📚 Manage Data

</h2>



<button class="admin-btn"
onclick="location.href='questions.html'">


Manage Questions


</button>





<button class="admin-btn"
onclick="location.href='results.html'">


View Results


</button>



</section>








<!-- =========================
     Footer
========================= -->


<footer class="admin-footer">



<img src="assets/file_00000000711871f8a9ea3ee0524225cb.png">



<h3>

G THE GENIUS

</h3>



<p>

Admin Management System

</p>



</footer>







</div>







<script type="module"
src="js/admin.js"></script>



</body>

</html>
