<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>G THE GENIUS - Admin Panel</title>

<link rel="stylesheet" href="admin.css">

</head>

<body>

<div class="admin-container">

<!-- HEADER -->

<header class="admin-header">

<h1>🛠️ G THE GENIUS</h1>

<p>Professional Admin Panel</p>

<button id="logoutBtn" class="logout-btn">
🚪 Logout
</button>

</header>

<!-- DASHBOARD -->

<div class="dashboard-cards">

<div class="card">

<h2 id="totalQuestions">0</h2>

<p>Total Questions</p>

</div>

<div class="card">

<h2 id="totalStudents">0</h2>

<p>Total Students</p>

</div>

<div class="card">

<h2 id="totalResults">0</h2>

<p>Total Results</p>

</div>

</div>

<!-- SEARCH -->

<div class="search-box">

<input
type="text"
id="searchQuestion"
placeholder="🔍 Search Question">

</div>

<!-- BULK UPLOAD -->

<div class="section">

<h2>📤 Bulk Upload Questions</h2>

<label>📚 Select Subject</label>

<select id="bulkSubject">

<option value="">Select Subject</option>

<option value="General Knowledge">General Knowledge</option>

<option value="Indian Polity">Indian Polity</option>

<option value="Indian History">Indian History</option>

<option value="Indian Geography">Indian Geography</option>

<option value="Indian Economy">Indian Economy</option>

<option value="General Science">General Science</option>

<option value="Physics">Physics</option>

<option value="Chemistry">Chemistry</option>

<option value="Biology">Biology</option>

<option value="Tamil">Tamil</option>

<option value="English">English</option>

<option value="Reasoning">Reasoning</option>

<option value="Aptitude">Aptitude</option>

<option value="Computer">Computer</option>

<option value="Current Affairs">Current Affairs</option>

<option value="Psychology">Psychology</option>

<option value="Physical Training">Physical Training</option>

<option value="TNUSRB Special">TNUSRB Special</option>

<option value="TNPSC Special">TNPSC Special</option>

</select>

<br><br>

<label>📂 Select Topic</label>

<select id="bulkTopic">

<option value="">Select Topic</option>

</select>

<br><br>

<label>📋 Paste JSON Questions</label>

<textarea
id="bulkJson"
rows="12"
placeholder="Paste JSON Questions Here..."></textarea>

<br><br>

<button id="uploadBtn">

📤 Upload Questions

</button>

<div id="uploadStatus"></div>

</div>

  <!-- ================= QUESTION MANAGEMENT ================= -->

<div class="section">

<h2>📚 All Questions</h2>

<p id="questionCount">
📊 Total Questions : 0
</p>

<div id="questionList">

</div>

</div>


<!-- ================= STUDENTS ================= -->

<div class="section">

<h2>👨‍🎓 Students</h2>

<div id="studentList">

</div>

</div>


<!-- ================= RESULTS ================= -->

<div class="section">

<h2>🏆 Student Results</h2>

<p id="resultCount">
📊 Total Results : 0
</p>

<div id="resultList">

</div>

</div>


<!-- ================= LEADERBOARD ================= -->

<div class="section">

<h2>🥇 Leaderboard</h2>

<div id="leaderboardList">

</div>

</div>


<!-- ================= FOOTER ================= -->

<footer class="footer">

<p>

© 2026 G THE GENIUS

</p>

</footer>

</div>


<script type="module" src="admin.js"></script>

</body>

</html>
