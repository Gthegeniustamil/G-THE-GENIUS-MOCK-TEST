<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>G THE GENIUS Admin Panel</title>


<style>

*{
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}


body{

    margin:0;
    min-height:100vh;
    background:
    linear-gradient(135deg,#050b18,#081d45);

    color:white;
    padding:20px;

}



.admin-container{

    max-width:750px;
    margin:auto;

}



.header{

    text-align:center;
    margin-bottom:20px;

}


.logo{

    width:90px;
    height:90px;
    border-radius:50%;
    object-fit:cover;

    border:3px solid #FFD700;

}



.header h1{

    color:#FFD700;
    margin:10px 0 5px;
    font-size:28px;

}


.badge{

    display:inline-block;
    background:#FFD700;
    color:#000;
    padding:6px 15px;

    border-radius:20px;
    font-weight:bold;
    font-size:14px;

}



/* CARD */


.card{

    background:
    rgba(255,255,255,0.08);

    backdrop-filter:blur(15px);

    border:1px solid rgba(255,215,0,0.3);

    border-radius:20px;

    padding:25px;

    box-shadow:
    0 10px 30px rgba(0,0,0,0.4);

}



/* INPUT AREA */


label{

    display:block;

    margin-top:18px;

    margin-bottom:8px;

    font-weight:600;

    color:#FFD700;

}



select,
textarea{


    width:100%;

    padding:14px;

    border-radius:12px;

    border:none;

    outline:none;

    background:#101c3a;

    color:white;

    font-size:15px;

}



select:focus,
textarea:focus{

    border:1px solid #FFD700;

}



textarea{

    height:260px;

    resize:none;

}



/* BUTTON */


.upload-btn{


    width:100%;

    margin-top:25px;

    padding:15px;

    border:none;

    border-radius:30px;


    background:
    linear-gradient(90deg,#FFD700,#ffae00);


    color:#000;

    font-size:17px;

    font-weight:bold;

    cursor:pointer;


    transition:.3s;

}



.upload-btn:hover{

    transform:scale(1.03);

}



/* PROGRESS */


.progress-card{

    margin-top:25px;

    background:#050b18;

    padding:18px;

    border-radius:15px;

}



.progress-title{

    color:#FFD700;

    margin-bottom:10px;

}



.progress{

    height:22px;

    background:#222;

    border-radius:20px;

    overflow:hidden;

}



.progress-bar{

    width:0%;

    height:100%;

    background:#00ff88;

    transition:.5s;

}



.result-box{

    margin-top:15px;

    line-height:1.8;

    font-size:15px;

}



</style>


</head>


<body>



<div class="admin-container">


<div class="header">


<img src="assets/logo.png" class="logo">


<h1>
🚔 G THE GENIUS
</h1>


<span class="badge">
ADMIN PANEL
</span>


</div>





<div class="card">



<label>
📚 Select Subject
</label>


<select id="subject">


<option value="">
Choose Subject
</option>


<option>General Knowledge</option>

<option>Tamil Nadu GK</option>

<option>Indian Polity</option>

<option>History</option>

<option>Geography</option>

<option>Science</option>

<option>Aptitude</option>

<option>Reasoning</option>

<option>Current Affairs</option>

<option>TNUSRB Special</option>


</select>






<label>
📌 Select Topic
</label>


<select id="topic">


<option>
Choose Topic
</option>


</select>






<label>
📝 Bulk Questions JSON
</label>


<textarea 
id="bulkQuestions"
placeholder="Paste 25 / 50 / 100 Questions JSON here...">
</textarea>






<button class="upload-btn" id="uploadBtn">

🚀 UPLOAD QUESTIONS

</button>






<div class="progress-card">


<div class="progress-title">

📊 Upload Progress

</div>


<div class="progress">

<div class="progress-bar" id="progressBar">

</div>

</div>



<div class="result-box" id="result">

Waiting for upload...

</div>



</div>



</div>



</div>



<script type="module" src="admin.js"></script>


</body>


</html>
