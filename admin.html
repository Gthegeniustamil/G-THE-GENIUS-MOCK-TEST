<form id="questionForm">

Question

Option A

<label>

Option B

</label>


<input

type="text"

id="optionB"

required>


</div>





<div class="input-group">


<label>

Option C

</label>


<input

type="text"

id="optionC"

required>


</div>





<div class="input-group">


<label>

Option D

</label>


<input

type="text"

id="optionD"

placeholder="Enter Option D"

required>


    </div>

    <div class="input-group">


<label>

Correct Answer

</label>


<select id="correctAnswer" required>


<option value="">

</option>


<option value="0">

Option A

</option>


<option value="1">

Option B

</option>


<option value="2">

Option C

</option>


<option value="3">

Option D

</option>


</select>


</div>





<div class="input-group">


<label>

Exam Category

</label>

<option value="">

<option>

TNUSRB

</option>


<option>

TNPSC

</option>


<option>

</option>


<option>

Explanation

</label>

placeholder="Enter Answer Explanation"

></textarea>


</div>





<button type="submit" id="addQuestionBtn">

➕ Add Question

</button>



</form>



</section>

 <section class="bulk-section">

</textarea>



<button id="bulkUploadBtn">

</button>
