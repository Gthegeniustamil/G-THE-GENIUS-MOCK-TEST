<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
Mock Test | G THE GENIUS
</title>


<meta name="theme-color" content="#081229">


<link rel="icon"
href="assets/file_00000000711871f8a9ea3ee0524225cb.png">


<link rel="stylesheet"
href="css/mocktest.css">


<link rel="stylesheet"
href="css/style.css">


<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
rel="stylesheet">


</head>



<body>


<header class="test-header">


<div class="brand">


<img

src="assets/file_00000000711871f8a9ea3ee0524225cb.png"

class="logo">


<h2>

G THE GENIUS

</h2>


</div>



<div id="timer">

⏰ 05:00

</div>


</header>




<main class="test-container">



<section class="test-info">


<h2 id="testTitle">

Daily Mock Test

</h2>


<p>

Question:

<span id="questionNumber">

1

</span>

/

<span id="totalQuestions">

10

</span>

</p>


</section>

<section class="question-card">


<h3 id="questionText">

Question Loading...

</h3>



<div id="optionsContainer">


<!-- Options will load here -->


</div>



</section>





<section class="navigation">


<button id="previousBtn">

⬅ Previous

</button>



<button id="nextBtn">

Next ➡

</button>


</section>





<section class="question-palette">


<h3>

Question Palette

</h3>


<div id="palette">


<!-- Question numbers load here -->


</div>


</section>





<section class="submit-section">


<button id="submitBtn">

Submit Test

</button>


</section>

<section class="result-message">


<p id="testMessage"></p>


</section>




<footer class="test-footer">


<p>

© 2026 G THE GENIUS

</p>


<p>

All Government Exam Mock Test Portal

</p>


</footer>




<script type="module" src="js/mocktest.js"></script>



</body>
