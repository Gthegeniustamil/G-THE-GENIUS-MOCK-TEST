<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>G THE GENIUS Mock Test</title>


<link rel="stylesheet" href="mocktest.css">

</head>


<body>


<div class="container">


<!-- HEADER -->

<div class="header">

<img src="assets/logo.png" class="logo">


<h2>
🚔 G THE GENIUS
</h2>


<div id="timer">

⏰ 05:00

</div>


</div>





<!-- STATUS -->


<div class="status-card">


<div>

Total:
<span id="totalCount">
0
</span>

</div>


<div>

Answered:
<span id="answeredCount">
0
</span>

</div>


<div>

Remaining:
<span id="remainingCount">
0
</span>

</div>



</div>





<!-- PROGRESS -->


<div class="progress">

<div id="testProgress">

</div>

</div>







<!-- QUESTION BOX -->


<div class="question-card">


<div id="questionNumber">

Question 1/10

</div>



<h3 id="questionText">

Loading Question...

</h3>



<div id="optionsBox">


</div>



</div>







<!-- PALETTE -->


<div class="palette-card">


<h3>
Question Palette
</h3>


<div id="questionPalette">

</div>


</div>







<!-- BUTTONS -->


<div class="button-area">

    <button id="prevBtn">
        ⬅ Previous
    </button>

    <button id="submitBtn">
        ✅ Submit Test
    </button>

    <button id="nextBtn">
        Next ➡
    </button>

</div>




</div>





<script type="module" src="mocktest.js"></script>


</body>

</html>
